<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 720" role="img" aria-labelledby="title desc">
  <title id="title">LCD shelf display screen for retail promotions</title>
  <desc id="desc">A slim LCD shelf screen mounted on a dark premium retail shelf showing a product promotion.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#0d0d0d"/>
      <stop offset="0.55" stop-color="#1e1e1e"/>
      <stop offset="1" stop-color="#121212"/>
    </linearGradient>
    <linearGradient id="screen" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#2f2f2f"/>
      <stop offset="0.45" stop-color="#c9a84c"/>
      <stop offset="1" stop-color="#7d6a2c"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-25%" width="140%" height="150%">
      <feDropShadow dx="0" dy="24" stdDeviation="22" flood-color="#000" flood-opacity="0.5"/>
    </filter>
  </defs>
  <rect width="960" height="720" fill="url(#bg)"/>
  <rect x="88" y="155" width="784" height="86" rx="10" fill="#282828"/>
  <rect x="108" y="236" width="744" height="16" rx="8" fill="#c9a84c" opacity="0.7"/>
  <rect x="88" y="478" width="784" height="86" rx="10" fill="#282828"/>
  <rect x="108" y="558" width="744" height="16" rx="8" fill="#c9a84c" opacity="0.7"/>
  <g opacity="0.9">
    <rect x="134" y="100" width="124" height="140" rx="20" fill="#383838"/>
    <rect x="304" y="82" width="150" height="158" rx="24" fill="#303030"/>
    <rect x="704" y="92" width="132" height="148" rx="22" fill="#353535"/>
    <rect x="154" y="424" width="138" height="140" rx="20" fill="#303030"/>
    <rect x="666" y="410" width="150" height="154" rx="24" fill="#373737"/>
  </g>
  <g filter="url(#shadow)">
    <rect x="270" y="296" width="420" height="128" rx="18" fill="#111" stroke="#4a4a4a" stroke-width="8"/>
    <rect x="292" y="318" width="376" height="84" rx="10" fill="url(#screen)"/>
    <circle cx="328" cy="360" r="24" fill="#111" opacity="0.8"/>
    <rect x="372" y="336" width="112" height="13" rx="6.5" fill="#111" opacity="0.75"/>
    <text x="372" y="382" font-family="Arial, sans-serif" font-size="42" font-weight="800" fill="#111">AED 49</text>
    <rect x="548" y="340" width="82" height="40" rx="20" fill="#111" opacity="0.82"/>
    <text x="567" y="366" font-family="Arial, sans-serif" font-size="19" font-weight="700" fill="#f3e9bf">PROMO</text>
  </g>
</svg>